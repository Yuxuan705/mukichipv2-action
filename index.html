<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUKICHIP V2: DAILY SOLVER - ACTION</title>
  
  <!-- 引入 Google Fonts: Bagel Fat One Regular -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
  
  <style>
    /* 引入 GitHub 仓库同目录下的 LiyuShoushu.ttf 字体文件 */
    @font-face {
      font-family: 'Liyu Shoushu';
      src: url('LiyuShoushu.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* 全局配色变量 */
    :root {
      --bg-color: #ffffff;        /* 整体背景：纯白 */
      --main-brown: #926653;      /* 褐色 */
      --accent-orange: #EEA445;   /* 橙色 */
      --card-bg: #F8F6F3;        /* 展示卡片背景 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 20px 60px;
      color: var(--main-brown);
      overflow-x: hidden;
    }

    /* 手机端主容器 */
    .mobile-container {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* 1. 主标题 (Bagel Fat One Regular, 字间距 +50) */
    .main-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 20px;
      color: var(--main-brown);
      letter-spacing: 0.05em; /* 字间距 +50 */
      text-transform: uppercase;
      margin-top: 5px;
      margin-bottom: 15px;
      text-align: center;
    }

    /* 2. 盖印章按压互动区 */
    .stamp-interactive-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .stamp-handle-img {
      width: 90px;
      height: auto;
      display: block;
      transition: transform 0.1s ease;
      user-select: none;
    }

    /* 点击按压“啪嗒”动画 */
    .stamp-interactive-area.pressing .stamp-handle-img {
      animation: stampPress 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes stampPress {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(12px) scale(0.85) rotate(-3deg); }
      100% { transform: translateY(0) scale(1); }
    }

    /* 3. Action 展示卡片 */
    .action-card {
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 20px 18px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* 细线分割线 */
    .divider-line {
      width: 100%;
      height: 1px;
      background-color: var(--accent-orange);
      margin: 6px 0;
      opacity: 0.5;
    }

    /* TO DO OR NOT TO DO? (靠左对齐，Liyu Shoushu 字体) */
    .question-prompt {
      width: 100%;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      font-size: 14px;
      color: var(--main-brown);
      letter-spacing: 0.05em;
      margin: 2px 0;
      text-transform: uppercase;
      text-align: left;
      padding: 0 8px;
    }

    /* 4. 印章落印显示区 (靠左对齐) */
    .stamp-result-container {
      width: 100%;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      min-height: 120px;
      position: relative;
    }

    /* 盖下的 Muki 印章 PNG */
    .muki-stamp-mark {
      width: 110px;
      height: auto;
      margin-bottom: 8px;
      display: block;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .muki-stamp-mark.pop {
      animation: stampPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes stampPop {
      0% { transform: scale(2) rotate(-10deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* 英文主文案 (大字，Bagel Fat One Regular) */
    .en-stamp-title {
      width: 100%;
      font-family: 'Bagel Fat One', cursive, sans-serif;
      color: var(--accent-orange);
      font-size: 20px;
      letter-spacing: 0.05em;
      line-height: 1.2;
      margin-bottom: 4px;
      text-transform: uppercase;
      text-align: left;
    }

    /* 英文描述/中文辅助 (小字，Liyu Shoushu 字体) */
    .sub-text {
      width: 100%;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      color: var(--main-brown);
      font-size: 13px;
      line-height: 1.35;
      text-transform: uppercase;
      word-break: break-word;
      text-align: left;
    }

    /* 5. 底部 Muki 插图 + IG 印章 */
    .muki-bottom-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 15px;
      position: relative;
    }

    .muki-bottom-img {
      width: 100%;
      max-width: 240px;
      height: auto;
      display: block;
    }

    /* IG 印章按钮 */
    .stamp-link {
      position: absolute;
      bottom: -10px;
      right: 5px;
      text-decoration: none;
      z-index: 10;
      transition: transform 0.15s ease;
    }

    .stamp-link:active {
      transform: scale(0.8);
    }

    .stamp-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      display: block;
    }

    /* 底部提示语 */
    .tap-tip {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 12px;
      color: var(--main-brown);
      letter-spacing: 0.05em; /* 字间距 +50 */
      margin-top: 22px;
      opacity: 0.5;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    
    <!-- 1. 主标题 -->
    <h1 class="main-title">MUKICHIP V2: DAILY SOLVER</h1>

    <!-- 2. 印章按压交互图 (自行替换为 stamp-handle.png) -->
    <div class="stamp-interactive-area" id="stampArea" onclick="pressStamp()">
      <img src="stamp-handle.png" alt="Stamp Handle" class="stamp-handle-img" id="stampHandle" onerror="this.src='https://via.placeholder.com/90x90/926653/FFFFFF?text=STAMP+PNG'">
    </div>

    <!-- 3. Action 结果展示卡片 -->
    <div class="action-card">
      <div class="divider-line"></div>
      <div class="question-prompt">TO DO OR NOT TO DO?</div>
      <div class="divider-line"></div>

      <!-- 印章落印与文案展示区 (靠左对齐) -->
      <div class="stamp-result-container">
        <!-- 动态改变的 Muki 印章图案 (如 stamp-muki-1.png ~ stamp-muki-6.png) -->
        <img src="stamp-muki-1.png" alt="Muki Stamp Mark" class="muki-stamp-mark" id="stampMark" onerror="this.src='https://via.placeholder.com/110x50/EEA445/FFFFFF?text=STAMP+MARK'">
        
        <div class="en-stamp-title" id="enTitle">DO IT NOW!!</div>
        <div class="sub-text" id="subText">Stop thinking and do it right now!</div>
      </div>
    </div>

    <!-- 4. 底部 Muki 插图 + IG 印章 -->
    <div class="muki-bottom-wrapper">
      <img src="action-muki.png" alt="Muki Illustration" class="muki-bottom-img" onerror="this.src='https://via.placeholder.com/240x110/F8F6F3/926653?text=MUKI+ILLUSTRATION'">
      
      <!-- Instagram 印章按钮 -->
      <a href="https://www.instagram.com/yuxuantsuki" target="_blank" rel="noopener noreferrer" class="stamp-link">
        <img src="ig-stamp.png" alt="@yuxuantsuki stamp" class="stamp-img" onerror="this.src='https://via.placeholder.com/80x80/926653/FFFFFF?text=STAMP'">
      </a>
    </div>

    <!-- 底部点击提示 -->
    <div class="tap-tip" onclick="pressStamp()">[ 点击盖章 / STAMP HERE ]</div>

  </div>

  <script>
    /* ========================================================
       印章数据池 (可以配置你的 6 个或更多 Muki 印章图片与英文文案)
       ======================================================== */
    const actionStamps = [
      {
        img: "stamp-muki-1.png",
        title: "DO IT NOW!!",
        sub: "Stop thinking and start right now!"
      },
      {
        img: "stamp-muki-2.png",
        title: "STAMP AGAIN!",
        sub: "The universe needs a second thought."
      },
      {
        img: "stamp-muki-3.png",
        title: "SLACK OFF TODAY",
        sub: "Forgive yourself and go rest completely!"
      },
      {
        img: "stamp-muki-4.png",
        title: "PLAN FIRST, DO LATER",
        sub: "Make a quick plan before stepping in!"
      },
      {
        img: "stamp-muki-5.png",
        title: "REST 30 MINS",
        sub: "Take a 30-minute break then start!"
      },
      {
        img: "stamp-muki-6.png",
        title: "FIND A BUDDY!",
        sub: "Get a friend to supervise you!"
      }
    ];

    /* ========================================================
       物理盖章逻辑与动画触发
       ======================================================== */
    let isStamping = false;

    function pressStamp() {
      if (isStamping) return;
      isStamping = true;

      const stampArea = document.getElementById('stampArea');
      const stampMark = document.getElementById('stampMark');
      const enTitle = document.getElementById('enTitle');
      const subText = document.getElementById('subText');

      // 触发印章手柄“按压”动画
      stampArea.classList.remove('pressing');
      void stampArea.offsetWidth; // 触发 reflow
      stampArea.classList.add('pressing');

      // 0.15 秒手柄压下时，更换印章结果
      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * actionStamps.length);
        const selected = actionStamps[randomIndex];

        stampMark.src = selected.img;
        enTitle.textContent = selected.title;
        subText.textContent = selected.sub;

        // 触发落印弹出动画
        stampMark.classList.remove('pop');
        void stampMark.offsetWidth;
        stampMark.classList.add('pop');
      }, 150);

      setTimeout(() => {
        isStamping = false;
      }, 400);
    }
  </script>
</body>
</html>
