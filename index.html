<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUKICHIP V2: DAILY SOLVER - ACTION</title>
  
  <!-- 引入 Google Fonts: Bagel Fat One Regular -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
  
  <style>
    /* 引入 GitHub 仓库同目录下的 LiyuShoushu.ttf 字体文件 */
    @font-face {
      font-family: 'Liyu Shoushu';
      src: url('LiyuShoushu.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* 全局配色变量 */
    :root {
      --bg-color: #ffffff;        /* 整体背景颜色：纯白 */
      --main-brown: #926653;      /* 指定褐色文字颜色 */
      --accent-orange: #EEA445;   /* 指定橙色文字与线条颜色 */
      --card-bg: #F8F6F3;        /* 展示卡片背景颜色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 20px 60px;
      color: var(--main-brown);
      overflow-x: hidden;
    }

    /* 手机端主容器 */
    .mobile-container {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* 1. 主标题 */
    .main-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 20px;
      color: var(--main-brown);
      letter-spacing: 0.05em; /* 字间距 +50 */
      text-transform: uppercase;
      margin-top: 5px;
      margin-bottom: 15px;
      text-align: center;
    }

    /* 2. 5 只漂浮透明鬼的容器 */
    .ghosts-container {
      width: 100%;
      height: 130px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      position: relative;
      margin-bottom: 10px;
    }

    /* 小鬼 PNG 图片样式与漂浮动画 */
    .ghost-item {
      width: 52px;
      height: auto;
      cursor: pointer;
      filter: drop-shadow(0 4px 6px rgba(146, 102, 83, 0.15));
      transition: transform 0.2s ease;
      user-select: none;
    }

    /* 错落有致的上下上下上下漂浮 animation */
    .ghost-1 { animation: floatGhost 3.0s ease-in-out infinite 0s; }
    .ghost-2 { animation: floatGhost 3.4s ease-in-out infinite 0.5s; }
    .ghost-3 { animation: floatGhost 2.8s ease-in-out infinite 1.0s; }
    .ghost-4 { animation: floatGhost 3.2s ease-in-out infinite 0.3s; }
    .ghost-5 { animation: floatGhost 2.9s ease-in-out infinite 0.8s; }

    @keyframes floatGhost {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-12px) rotate(3deg);
      }
    }

    /* 点击小鬼时的弹跳反馈 */
    .ghost-item:active {
      transform: scale(0.75) !important;
    }

    /* 3. Action 展示卡片 */
    .action-card {
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 20px 18px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* 滚动抽签时的模糊与淡化效果 */
    .action-card.rolling .answer-container {
      filter: blur(1px);
      opacity: 0.7;
    }

    /* - ACTION SOLVER - 标头 */
    .card-header-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 18px;
      color: var(--accent-orange);
      letter-spacing: 0.05em; /* 字间距 +50 */
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    /* 细线分割线 */
    .divider-line {
      width: 100%;
      height: 1px;
      background-color: var(--accent-orange);
      margin: 6px 0 10px;
      opacity: 0.5;
    }

    /* TO DO OR NOT TO DO? (靠左对齐，Liyu Shoushu 字体) */
    .question-prompt {
      width: 100%;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      font-size: 14px;
      color: var(--main-brown);
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      text-transform: uppercase;
      text-align: left;
      padding: 0 8px;
    }

    /* 4. 答案显示区域 (靠左对齐) */
    .answer-container {
      width: 100%;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      min-height: 100px;
      transition: opacity 0.1s ease;
    }

    /* 中文答案 (靠左对齐，Liyu Shoushu 字体) */
    .zh-text {
      width: 100%;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      color: var(--main-brown);
      font-size: 18pt;
      line-height: 1.35;
      margin-bottom: 6px;
      word-break: break-word;
      text-align: left;
    }

    /* 英文答案 (靠左对齐，Liyu Shoushu 字体) */
    .en-text {
      width: 100%;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      color: var(--main-brown);
      font-size: 11px;
      line-height: 1.3;
      text-transform: uppercase;
      word-break: break-word;
      text-align: left;
    }

    /* 5. 底部抱着电脑想死的 Muki 插图 */
    .muki-laptop-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 15px;
      position: relative;
    }

    .muki-laptop-img {
      width: 100%;
      max-width: 260px;
      height: auto;
      display: block;
    }

    /* 6. 右下角/底部的 Instagram 印章按钮 */
    .stamp-link {
      position: absolute;
      bottom: -15px;
      right: 5px;
      text-decoration: none;
      z-index: 10;
      transition: transform 0.15s ease;
    }

    .stamp-link:active {
      transform: scale(0.8);
    }

    .stamp-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      display: block;
    }

    /* 底部提示语 */
    .tap-tip {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 12px;
      color: var(--main-brown);
      letter-spacing: 0.05em; /* 字间距 +50 */
      margin-top: 25px;
      opacity: 0.5;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    
    <!-- 1. 主标题 -->
    <h1 class="main-title">MUKICHIP V2: DAILY SOLVER</h1>

    <!-- 2. 5 只悬浮的透明小鬼 (点击任意一只触发抽签) -->
    <div class="ghosts-container">
      <img src="ghost-1.png" alt="Ghost 1" class="ghost-item ghost-1" onclick="triggerAction()" onerror="this.src='https://via.placeholder.com/52x60/926653/FFFFFF?text=👻1'">
      <img src="ghost-2.png" alt="Ghost 2" class="ghost-item ghost-2" onclick="triggerAction()" onerror="this.src='https://via.placeholder.com/52x60/EEA445/FFFFFF?text=👻2'">
      <img src="ghost-3.png" alt="Ghost 3" class="ghost-item ghost-3" onclick="triggerAction()" onerror="this.src='https://via.placeholder.com/52x60/926653/FFFFFF?text=👻3'">
      <img src="ghost-4.png" alt="Ghost 4" class="ghost-item ghost-4" onclick="triggerAction()" onerror="this.src='https://via.placeholder.com/52x60/EEA445/FFFFFF?text=👻4'">
      <img src="ghost-5.png" alt="Ghost 5" class="ghost-item ghost-5" onclick="triggerAction()" onerror="this.src='https://via.placeholder.com/52x60/926653/FFFFFF?text=👻5'">
    </div>

    <!-- 3. Action 结果展示卡片 -->
    <div class="action-card" id="actionCard">
      <div class="card-header-title">- ACTION SOLVER -</div>
      
      <div class="divider-line"></div>
      <div class="question-prompt">TO DO OR NOT TO DO?</div>
      <div class="divider-line"></div>

      <!-- 答案核心展示区 (靠左对齐，Liyu Shoushu 字体) -->
      <div class="answer-container">
        <p class="zh-text" id="zhDisplay">阻力太大？只做 2 分钟！2分钟后随时可以停！</p>
        <p class="en-text" id="enDisplay">TOO HARD? DO IT FOR 2 MINUTES ONLY, THEN STOP ANYTIME!</p>
      </div>
    </div>

    <!-- 4. 底部抱着电脑想死的 Muki + IG 印章 -->
    <div class="muki-laptop-wrapper">
      <img src="muki-laptop.png" alt="Exhausted Muki with Laptop" class="muki-laptop-img" onerror="this.src='https://via.placeholder.com/260x120/F8F6F3/926653?text=MUKI+LAPTOP+PNG'">
      
      <!-- Instagram 印章按钮 -->
      <a href="https://www.instagram.com/yuxuantsuki" target="_blank" rel="noopener noreferrer" class="stamp-link">
        <img src="ig-stamp.png" alt="@yuxuantsuki stamp" class="stamp-img" onerror="this.src='https://via.placeholder.com/80x80/926653/FFFFFF?text=STAMP'">
      </a>
    </div>

    <!-- 底部重抽提示 -->
    <div class="tap-tip" onclick="triggerAction()">[ 戳一戳小鬼 / TAP A GHOST TO SOLVE ]</div>

  </div>

  <script>
    /* ========================================================
       ACTION 破除拖延/行动决策数据池 (40 项)
       ======================================================== */
    const actionDecisions = [
      {
        zh: "阻力太大？只做 2 分钟！2分钟后随时可以停！",
        en: "TOO HARD? DO IT FOR 2 MINUTES ONLY, THEN STOP ANYTIME!"
      },
      {
        zh: "别想了！脑子在骗你，但手脚已经准备好了，立刻开始！",
        en: "STOP THINKING! YOUR BRAIN IS LYING, START RIGHT NOW!"
      },
      {
        zh: "今天真的没能量，果断放过自己去休息！",
        en: "OUT OF ENERGY TODAY! FORGIVE YOURSELF AND GO REST!"
      },
      {
        zh: "先做最烂的版本出来！先完成，再完美！",
        en: "MAKE A TERRIBLE DRAFT FIRST! DONE IS BETTER THAN PERFECT!"
      },
      {
        zh: "别卡在桌子前发呆了！换去咖啡馆或者床上做！",
        en: "DON'T STARED AT YOUR DESK! MOVE TO A CAFE OR BED!"
      },
      {
        zh: "关掉所有社交软件 15 分钟，专注搞定第一步！",
        en: "CLOSE SOCIAL MEDIA FOR 15 MINS, FOCUS ON STEP ONE!"
      },
      {
        zh: "这件事根本不重要！直接从清单划掉，去睡觉！",
        en: "THIS DOESN'T MATTER! CROSS IT OFF AND GO TO SLEEP!"
      },
      {
        zh: "倒数 3、2、1，像发射火箭一样立刻站起来！",
        en: "COUNTDOWN 3, 2, 1, STAND UP LIKE A ROCKET LAUNCH!"
      },
      {
        zh: "去洗个脸、喝口水，10 分钟后回来再战！",
        en: "WASH YOUR FACE, DRINK WATER, COME BACK IN 10 MINS!"
      },
      {
        zh: "把它拆成三个极小的小步，只做第一步！",
        en: "BREAK IT INTO 3 TINY STEPS, DO ONLY THE FIRST ONE!"
      },
      {
        zh: "把手机放到拿不到的地方，现在就开始！",
        en: "PUT YOUR PHONE OUT OF REACH, START RIGHT NOW!"
      },
      {
        zh: "小鬼看穿你了！你只是太累了，今天不做！",
        en: "GHOST SEES YOU! YOU'RE JUST TIRED, SKIP IT TODAY!"
      },
      {
        zh: "放一首最热血的音乐，跟着节奏做起来！",
        en: "PLAY YOUR FAVORITE BANGER AND GET MOVIN'!"
      },
      {
        zh: "找个同伴监督你，做不完请他喝奶茶！",
        en: "FIND A FRIEND TO SUPERVISE YOU, BUY THEM BOBA IF UNFINISHED!"
      },
      {
        zh: "做完这件事，你就可以肆无忌惮地摆烂了！",
        en: "FINISH THIS AND YOU CAN LAZE AROUND GUILT-FREE!"
      },
      {
        zh: "不要准备了！最好的准备就是直接开始！",
        en: "STOP PREPARING! THE BEST PREPARATION IS STARTING!"
      },
      {
        zh: "今天不适合硬撑，放手去吃顿好的！",
        en: "DON'T FORCE IT TODAY. GO ENJOY A GOOD MEAL INSTEAD!"
      },
      {
        zh: "给自己设定一个 25 分钟番茄钟，响了就停！",
        en: "SET A 25-MIN TIMER. STOP IMMEDIATELY WHEN IT RINGS!"
      },
      {
        zh: "这件事其实只需 5 分钟，别在脑子里折磨自己了！",
        en: "IT ONLY TAKES 5 MINS, STOP TORTURING YOUR BRAIN!"
      },
      {
        zh: "相信你的直觉，现在就去把它干掉！",
        en: "TRUST YOUR GUT, GO SLAY IT RIGHT NOW!"
      }
    ];

    /* ========================================================
       2 秒滚动抽签逻辑 (点击小鬼触发)
       ======================================================== */
    let isRolling = false;

    function triggerAction() {
      if (isRolling) return;
      isRolling = true;

      const actionCard = document.getElementById('actionCard');
      const zhDisplay = document.getElementById('zhDisplay');
      const enDisplay = document.getElementById('enDisplay');

      actionCard.classList.add('rolling');

      const duration = 1500;    // 1.5 秒
      const intervalTime = 60;  // 60ms 快速交替
      let elapsedTime = 0;

      const timer = setInterval(() => {
        const tempIndex = Math.floor(Math.random() * actionDecisions.length);
        zhDisplay.textContent = actionDecisions[tempIndex].zh;
        enDisplay.textContent = actionDecisions[tempIndex].en;

        elapsedTime += intervalTime;

        if (elapsedTime >= duration) {
          clearInterval(timer);
          
          const finalIndex = Math.floor(Math.random() * actionDecisions.length);
          zhDisplay.textContent = actionDecisions[finalIndex].zh;
          enDisplay.textContent = actionDecisions[finalIndex].en;

          actionCard.classList.remove('rolling');
          isRolling = false;
        }
      }, intervalTime);
    }
  </script>
</body>
</html>
