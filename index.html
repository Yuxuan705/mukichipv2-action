<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUKICHIP V2: DAILY SOLVER - ACTION</title>
  
  <!-- 引入 Google Fonts: Bagel Fat One Regular -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
  
  <style>
    /* 引入 GitHub 仓库同目录下的 LiyuShoushu.ttf 字体文件 */
    @font-face {
      font-family: 'Liyu Shoushu';
      src: url('LiyuShoushu.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* 全局配色变量 */
    :root {
      --bg-color: #ffffff;        /* 整体背景颜色：纯白 */
      --main-brown: #926653;      /* 褐色文字颜色 */
      --accent-orange: #EEA445;   /* 橙色文字与线条颜色 */
      --card-bg: #F8F6F3;        /* 展示卡片背景颜色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 20px 60px;
      color: var(--main-brown);
      overflow-x: hidden;
    }

    /* 手机端主容器 */
    .mobile-container {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* 1. 主标题 */
    .main-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 20px;
      color: var(--main-brown);
      letter-spacing: 0.05em; /* 字间距 +50 */
      text-transform: uppercase;
      margin-top: 5px;
      margin-bottom: 12px;
      text-align: center;
    }

    /* 2. 顶部的 1-6 点数规则对照图/卡片 */
    .rules-card {
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 15px;
    }

    .rules-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 14px;
      color: var(--accent-orange);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-align: center;
    }

    .rules-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px 12px;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      font-size: 13px;
      color: var(--main-brown);
      text-align: left;
    }

    .rule-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .rule-num {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      color: var(--accent-orange);
      font-size: 14px;
    }

    /* 3. 中间摇骰子区域 */
    .dice-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px 0 18px;
      cursor: pointer;
    }

    /* 骰子外观 (可改用 dice.png，默认用立体 CSS 骰子) */
    .dice-box {
      width: 85px;
      height: 85px;
      background-color: var(--card-bg);
      border: 3px solid var(--main-brown);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 42px;
      color: var(--accent-orange);
      box-shadow: 0 8px 0px var(--main-brown);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
    }

    .dice-box:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0px var(--main-brown);
    }

    /* 摇骰子动画 */
    .dice-box.rolling {
      animation: rollDice 1.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes rollDice {
      0% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-25deg) scale(1.1) translateY(-10px); }
      40% { transform: rotate(30deg) scale(0.9) translateY(5px); }
      60% { transform: rotate(-15deg) scale(1.05); }
      80% { transform: rotate(10deg) scale(0.98); }
      100% { transform: rotate(0deg) scale(1); }
    }

    /* 4. Action 结果展示卡片 */
    .action-card {
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 18px 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .card-header-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 18px;
      color: var(--accent-orange);
      letter-spacing: 0.05em; /* 字间距 +50 */
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    /* 细线分割线 */
    .divider-line {
      width: 100%;
      height: 1px;
      background-color: var(--accent-orange);
      margin: 6px 0;
      opacity: 0.5;
    }

    /* TO DO OR NOT TO DO? (靠左对齐，Liyu Shoushu 字体) */
    .question-prompt {
      width: 100%;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      font-size: 14px;
      color: var(--main-brown);
      letter-spacing: 0.05em;
      margin: 2px 0;
      text-transform: uppercase;
      text-align: left;
      padding: 0 8px;
    }

    /* 答案显示区域 (靠左对齐) */
    .answer-container {
      width: 100%;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      min-height: 90px;
    }

    /* 中文答案 (靠左对齐，Liyu Shoushu 字体) */
    .zh-text {
      width: 100%;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      color: var(--main-brown);
      font-size: 18pt;
      line-height: 1.35;
      margin-bottom: 4px;
      word-break: break-word;
      text-align: left;
    }

    /* 英文答案 (靠左对齐，Liyu Shoushu 字体) */
    .en-text {
      width: 100%;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      color: var(--main-brown);
      font-size: 11px;
      line-height: 1.3;
      text-transform: uppercase;
      word-break: break-word;
      text-align: left;
    }

    /* 5. 底部 Muki 插图 + IG 印章 */
    .muki-laptop-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 15px;
      position: relative;
    }

    .muki-laptop-img {
      width: 100%;
      max-width: 240px;
      height: auto;
      display: block;
    }

    /* 印章按钮 */
    .stamp-link {
      position: absolute;
      bottom: -10px;
      right: 5px;
      text-decoration: none;
      z-index: 10;
      transition: transform 0.15s ease;
    }

    .stamp-link:active {
      transform: scale(0.8);
    }

    .stamp-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      display: block;
    }

    /* 底部提示语 */
    .tap-tip {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 12px;
      color: var(--main-brown);
      letter-spacing: 0.05em; /* 字间距 +50 */
      margin-top: 22px;
      opacity: 0.5;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    
    <!-- 1. 主标题 -->
    <h1 class="main-title">MUKICHIP V2: DAILY SOLVER</h1>

    <!-- 2. 1-6 点数规则对照表 -->
    <div class="rules-card">
      <div class="rules-title">- DICE RULEBOOK -</div>
      <div class="rules-grid">
        <div class="rule-item"><span class="rule-num">1:</span> 绝不强求 (NO)</div>
        <div class="rule-item"><span class="rule-num">2:</span> 换个环境 (MOVE)</div>
        <div class="rule-item"><span class="rule-num">3:</span> 2分钟微行动</div>
        <div class="rule-item"><span class="rule-num">4:</span> 先做烂版本</div>
        <div class="rule-item"><span class="rule-num">5:</span> 倒数 321 发射</div>
        <div class="rule-item"><span class="rule-num">6:</span> 立刻去做！(GO)</div>
      </div>
    </div>

    <!-- 3. 摇骰子交互区域 -->
    <div class="dice-area" onclick="rollDice()">
      <div class="dice-box" id="diceDisplay">6</div>
    </div>

    <!-- 4. Action 结果展示卡片 -->
    <div class="action-card">
      <div class="card-header-title">- ACTION SOLVER -</div>
      
      <div class="divider-line"></div>
      <div class="question-prompt">TO DO OR NOT TO DO?</div>
      <div class="divider-line"></div>

      <!-- 答案展示区 (靠左对齐，Liyu Shoushu 字体) -->
      <div class="answer-container">
        <p class="zh-text" id="zhDisplay">天选 6 号！别犹豫了，现在就去把它干掉！！</p>
        <p class="en-text" id="enDisplay">LUCKY SIX! STOP THINKING AND DO IT RIGHT NOW!!</p>
      </div>
    </div>

    <!-- 5. 底部 Muki 插图 + IG 印章 -->
    <div class="muki-laptop-wrapper">
      <img src="muki-laptop.png" alt="Muki Illustration" class="muki-laptop-img" onerror="this.src='https://via.placeholder.com/240x110/F8F6F3/926653?text=MUKI+ILLUSTRATION'">
      
      <!-- Instagram 印章按钮 -->
      <a href="https://www.instagram.com/yuxuantsuki" target="_blank" rel="noopener noreferrer" class="stamp-link">
        <img src="ig-stamp.png" alt="@yuxuantsuki stamp" class="stamp-img" onerror="this.src='https://via.placeholder.com/80x80/926653/FFFFFF?text=STAMP'">
      </a>
    </div>

    <!-- 底部点击提示 -->
    <div class="tap-tip" onclick="rollDice()">[ 摇摇骰子 / ROLL THE DICE ]</div>

  </div>

  <script>
    /* ========================================================
       1-6 骰子结果映射表
       ======================================================== */
    const diceDecisions = {
      1: {
        zh: "今天算了！神仙来了也别做，果断去休息摆烂！",
        en: "HARD NO TODAY! FORGIVE YOURSELF AND GO REST!"
      },
      2: {
        zh: "别卡在桌前发呆！换去床边、沙发或咖啡馆做！",
        en: "DON'T STARE AT YOUR DESK! MOVE TO A CAFE OR BED!"
      },
      3: {
        zh: "阻力太大？只做 2 分钟！2分钟后随时可以停！",
        en: "TOO HARD? DO IT FOR 2 MINUTES ONLY, THEN STOP!"
      },
      4: {
        zh: "先做最烂的版本出来！先完成，再完美！",
        en: "MAKE A TERRIBLE DRAFT FIRST! DONE IS BETTER THAN PERFECT!"
      },
      5: {
        zh: "倒数 3、2、1，像发射火箭一样立刻站起来！",
        en: "COUNTDOWN 3, 2, 1, STAND UP LIKE A ROCKET LAUNCH!"
      },
      6: {
        zh: "天选 6 号！别犹豫了，现在就去把它干掉！！",
        en: "LUCKY SIX! STOP THINKING AND DO IT RIGHT NOW!!"
      }
    };

    /* ========================================================
       摇骰子动画与随机数逻辑
       ======================================================== */
    let isRolling = false;

    function rollDice() {
      if (isRolling) return;
      isRolling = true;

      const diceDisplay = document.getElementById('diceDisplay');
      const zhDisplay = document.getElementById('zhDisplay');
      const enDisplay = document.getElementById('enDisplay');

      // 触发摇动动画
      diceDisplay.classList.remove('rolling');
      void diceDisplay.offsetWidth; // 触发 reflow
      diceDisplay.classList.add('rolling');

      const duration = 1500;   // 1.5 秒动画
      const intervalTime = 70; // 快速变动数字
      let elapsedTime = 0;

      const timer = setInterval(() => {
        const tempNum = Math.floor(Math.random() * 6) + 1;
        diceDisplay.textContent = tempNum;

        elapsedTime += intervalTime;

        if (elapsedTime >= duration) {
          clearInterval(timer);
          
          // 确定最终落点
          const finalNum = Math.floor(Math.random() * 6) + 1;
          diceDisplay.textContent = finalNum;
          zhDisplay.textContent = diceDecisions[finalNum].zh;
          enDisplay.textContent = diceDecisions[finalNum].en;

          isRolling = false;
        }
      }, intervalTime);
    }
  </script>
</body>
</html>
